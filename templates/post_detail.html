{% extends "base.html" %}

{% block title %}{{ post.title }} | Meu blog{% endblock %}

{% block content %}
    <article>
        <h1>{{ post.title }}</h1>
        <p>Publicado em {{ post.created_at|date:"d/m/Y H:i" }}</p>
        {{ post.content|safe }}
    </article>
    {% if user.is_staff %}
        <p>
            <a href="{% url 'blog:post_update' post.pk %}">Editar post</a>
            <a href="{% url 'blog:post_delete' post.pk %}">Remover post</a>
        </p>
    {% endif %}
{% endblock %}
